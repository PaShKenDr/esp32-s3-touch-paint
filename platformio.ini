[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Зависимости библиотек
lib_deps = 
    bodmer/TFT_eSPI@^2.5.0
    ArduinoJson@^6.21.2

; Конфигурация TFT_eSPI для GC9A01
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_RST=14
    -DTFT_BL=15
    -DSPI_FREQUENCY=80000000
    -DLOAD_GLFF=1
    -DSMOOTH_FONT=1
